<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rounded background -->
  <rect width="128" height="128" rx="22" ry="22" fill="#0f3460"/>

  <!-- Document / invoice body -->
  <rect x="28" y="44" width="58" height="70" rx="4" ry="4" fill="#ffffff"/>

  <!-- Dog-ear fold -->
  <polygon points="72,44 86,44 86,58" fill="#a0b4cc"/>
  <polygon points="72,44 72,58 86,58" fill="#dde6f0"/>

  <!-- Invoice lines (simulated content) -->
  <rect x="36" y="62" width="38" height="4" rx="2" fill="#c8d6e3"/>
  <rect x="36" y="72" width="28" height="4" rx="2" fill="#c8d6e3"/>
  <rect x="36" y="82" width="33" height="4" rx="2" fill="#c8d6e3"/>
  <!-- Amount line -->
  <rect x="36" y="96" width="42" height="5" rx="2" fill="#0f3460" opacity="0.35"/>

  <!-- Clock / pause badge (top-right of document, overlapping) -->
  <circle cx="85" cy="44" r="20" fill="#0f3460"/>
  <circle cx="85" cy="44" r="18" fill="#e8431a"/>

  <!-- Pause icon: two vertical bars -->
  <rect x="79" y="35" width="6" height="18" rx="2" fill="#ffffff"/>
  <rect x="90" y="35" width="6" height="18" rx="2" fill="#ffffff"/>
</svg>
