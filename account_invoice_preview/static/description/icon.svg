<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rounded background -->
  <rect width="128" height="128" rx="22" ry="22" fill="#0f3460"/>

  <!-- Invoice document -->
  <rect x="22" y="18" width="62" height="82" rx="4" ry="4" fill="#ffffff"/>

  <!-- Dog-ear fold -->
  <polygon points="70,18 84,18 84,32" fill="#a0b4cc"/>
  <polygon points="70,18 70,32 84,32" fill="#dde6f0"/>

  <!-- Invoice content lines -->
  <rect x="30" y="40" width="40" height="4" rx="2" fill="#c8d6e3"/>
  <rect x="30" y="50" width="30" height="4" rx="2" fill="#c8d6e3"/>
  <rect x="30" y="60" width="35" height="4" rx="2" fill="#c8d6e3"/>
  <rect x="30" y="70" width="24" height="4" rx="2" fill="#c8d6e3"/>
  <!-- Total line -->
  <rect x="30" y="84" width="44" height="6" rx="3" fill="#0f3460" opacity="0.35"/>

  <!-- Magnifier: lens over the bottom-right of the document -->
  <circle cx="84" cy="80" r="27" fill="#0f3460"/>
  <circle cx="84" cy="80" r="23" fill="#ffffff"/>
  <circle cx="84" cy="80" r="23" fill="none" stroke="#e8431a" stroke-width="6"/>

  <!-- Eye inside the lens -->
  <path d="M70 80 Q84 65 98 80 Q84 95 70 80 Z" fill="#0f3460" opacity="0.15"/>
  <path d="M70 80 Q84 66 98 80" fill="none" stroke="#0f3460" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M70 80 Q84 94 98 80" fill="none" stroke="#0f3460" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="84" cy="80" r="6.5" fill="#e8431a"/>

  <!-- Magnifier handle -->
  <rect x="99" y="95" width="9" height="26" rx="4.5" fill="#e8431a" transform="rotate(-45 103.5 108)"/>
</svg>
