<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1120" cy="90" r="200" fill="#e8431a" opacity="0.07"/>
  <circle cx="90" cy="830" r="170" fill="#a0b4cc" opacity="0.06"/>

  <!-- ── Title block ── -->
  <text x="600" y="112" text-anchor="middle" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1">Invoice PDF Live Preview</text>
  <text x="600" y="160" text-anchor="middle" fill="#a0b4cc" font-size="26">See the printed invoice while you edit it — no printing, no attachments</text>
  <rect x="512" y="188" width="176" height="34" rx="17" fill="#e8431a"/>
  <text x="600" y="211" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600" letter-spacing="1.5">ODOO 19</text>

  <!-- ══ App mockup ══ -->
  <g filter="url(#shadow)">
    <rect x="100" y="270" width="1000" height="470" rx="10" fill="#ffffff"/>

    <!-- Control bar -->
    <rect x="100" y="270" width="1000" height="44" rx="10" fill="#f1f3f6"/>
    <rect x="100" y="300" width="1000" height="14" fill="#f1f3f6"/>
    <circle cx="126" cy="292" r="6" fill="#e8431a"/>
    <circle cx="148" cy="292" r="6" fill="#f0b429"/>
    <circle cx="170" cy="292" r="6" fill="#3fbf7f"/>
    <text x="200" y="298" fill="#8896a8" font-size="15">Customer Invoice · INV/2026/00042</text>

    <!-- Button row -->
    <rect x="124" y="336" width="86" height="30" rx="4" fill="#eef1f5"/>
    <text x="167" y="356" text-anchor="middle" fill="#6b7a90" font-size="14">Confirm</text>
    <rect x="220" y="336" width="70" height="30" rx="4" fill="#eef1f5"/>
    <text x="255" y="356" text-anchor="middle" fill="#6b7a90" font-size="14">Print</text>
    <!-- Highlighted preview button -->
    <rect x="300" y="336" width="150" height="30" rx="4" fill="#e8431a"/>
    <circle cx="322" cy="351" r="7.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="322" cy="351" r="2.6" fill="#ffffff"/>
    <text x="345" y="356" fill="#ffffff" font-size="14" font-weight="600">PDF Preview</text>

    <!-- ── Left: form sheet ── -->
    <rect x="124" y="386" width="470" height="330" rx="6" fill="#ffffff" stroke="#e3e8ef" stroke-width="2"/>
    <text x="148" y="424" fill="#0f3460" font-size="26" font-weight="700">Draft Invoice</text>

    <rect x="148" y="446" width="90" height="10" rx="5" fill="#cfd8e3"/>
    <rect x="268" y="446" width="150" height="10" rx="5" fill="#eaeef4"/>
    <rect x="148" y="472" width="70" height="10" rx="5" fill="#cfd8e3"/>
    <rect x="268" y="472" width="120" height="10" rx="5" fill="#eaeef4"/>
    <rect x="148" y="498" width="82" height="10" rx="5" fill="#cfd8e3"/>
    <rect x="268" y="498" width="180" height="10" rx="5" fill="#eaeef4"/>

    <!-- Lines table -->
    <rect x="148" y="536" width="422" height="2" fill="#e3e8ef"/>
    <rect x="148" y="552" width="200" height="9" rx="4.5" fill="#dbe2ea"/>
    <rect x="470" y="552" width="100" height="9" rx="4.5" fill="#dbe2ea"/>
    <rect x="148" y="578" width="240" height="9" rx="4.5" fill="#eaeef4"/>
    <rect x="470" y="578" width="100" height="9" rx="4.5" fill="#eaeef4"/>
    <rect x="148" y="604" width="180" height="9" rx="4.5" fill="#eaeef4"/>
    <rect x="470" y="604" width="100" height="9" rx="4.5" fill="#eaeef4"/>
    <rect x="148" y="630" width="422" height="2" fill="#e3e8ef"/>
    <text x="570" y="668" text-anchor="end" fill="#0f3460" font-size="24" font-weight="700">€ 1.240,00</text>

    <!-- ── Right: PDF preview panel ── -->
    <rect x="614" y="386" width="462" height="330" rx="6" fill="#f7f8fb" stroke="#0f3460" stroke-width="2"/>
    <rect x="614" y="386" width="462" height="40" rx="6" fill="#0f3460"/>
    <rect x="614" y="414" width="462" height="12" fill="#0f3460"/>
    <text x="638" y="412" fill="#ffffff" font-size="15" font-weight="600">Invoice Preview</text>
    <rect x="946" y="396" width="72" height="22" rx="4" fill="#e8431a"/>
    <text x="982" y="411" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Refresh</text>
    <text x="1046" y="412" text-anchor="middle" fill="#ffffff" font-size="16">✕</text>

    <!-- Rendered PDF page -->
    <rect x="672" y="446" width="346" height="252" rx="3" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>
    <rect x="696" y="470" width="110" height="18" rx="3" fill="#0f3460" opacity="0.85"/>
    <rect x="900" y="470" width="94" height="8" rx="4" fill="#dbe2ea"/>
    <rect x="900" y="484" width="70" height="8" rx="4" fill="#eaeef4"/>
    <rect x="696" y="512" width="130" height="7" rx="3.5" fill="#cfd8e3"/>
    <rect x="696" y="528" width="100" height="7" rx="3.5" fill="#eaeef4"/>
    <rect x="696" y="556" width="298" height="1.5" fill="#e3e8ef"/>
    <rect x="696" y="570" width="160" height="7" rx="3.5" fill="#dbe2ea"/>
    <rect x="924" y="570" width="70" height="7" rx="3.5" fill="#dbe2ea"/>
    <rect x="696" y="590" width="190" height="7" rx="3.5" fill="#eaeef4"/>
    <rect x="924" y="590" width="70" height="7" rx="3.5" fill="#eaeef4"/>
    <rect x="696" y="610" width="140" height="7" rx="3.5" fill="#eaeef4"/>
    <rect x="924" y="610" width="70" height="7" rx="3.5" fill="#eaeef4"/>
    <rect x="696" y="632" width="298" height="1.5" fill="#e3e8ef"/>
    <rect x="854" y="650" width="140" height="12" rx="4" fill="#e8431a" opacity="0.85"/>
  </g>

  <!-- ── Feature strip ── -->
  <g fill="#ffffff" font-size="21">
    <circle cx="196" cy="800" r="12" fill="#e8431a"/>
    <text x="196" y="806" text-anchor="middle" font-size="15" font-weight="700">✓</text>
    <text x="218" y="807">Works on drafts</text>

    <circle cx="500" cy="800" r="12" fill="#e8431a"/>
    <text x="500" y="806" text-anchor="middle" font-size="15" font-weight="700">✓</text>
    <text x="522" y="807">One-click refresh</text>

    <circle cx="820" cy="800" r="12" fill="#e8431a"/>
    <text x="820" y="806" text-anchor="middle" font-size="15" font-weight="700">✓</text>
    <text x="842" y="807">No attachments left behind</text>
  </g>

  <text x="600" y="862" text-anchor="middle" fill="#a0b4cc" font-size="19">Lógica Consultores 360 · www.logicaconsultores.com</text>
</svg>
