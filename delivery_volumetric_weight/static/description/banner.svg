<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="200" fill="#e8431a" opacity="0.07"/>
  <circle cx="90" cy="830" r="170" fill="#a0b4cc" opacity="0.06"/>

  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-1">Delivery Volumetric Weight</text>
  <text x="600" y="154" text-anchor="middle" fill="#a0b4cc" font-size="25">Quote shipping on the weight your carrier actually bills</text>
  <rect x="512" y="180" width="176" height="34" rx="17" fill="#e8431a"/>
  <text x="600" y="203" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600" letter-spacing="1.5">ODOO 19</text>

  <!-- ══ Comparison: two parcels ══ -->
  <g filter="url(#shadow)">
    <rect x="90" y="256" width="480" height="360" rx="10" fill="#ffffff"/>
    <rect x="630" y="256" width="480" height="360" rx="10" fill="#ffffff"/>
  </g>

  <!-- LEFT card: small heavy parcel -->
  <text x="330" y="298" text-anchor="middle" fill="#0f3460" font-size="21" font-weight="700">Small &amp; heavy</text>
  <polygon points="330,330 392,361 330,392 268,361" fill="#e8eef5"/>
  <polygon points="268,361 330,392 330,452 268,421" fill="#cfd8e3"/>
  <polygon points="392,361 330,392 330,452 392,421" fill="#b6c4d4"/>
  <text x="330" y="492" text-anchor="middle" fill="#6b7a90" font-size="17">30 × 20 × 15 cm · 12,0 kg</text>
  <rect x="150" y="512" width="360" height="1.5" fill="#e3e8ef"/>
  <text x="172" y="546" fill="#6b7a90" font-size="17">Real weight</text>
  <text x="488" y="546" text-anchor="end" fill="#0f3460" font-size="17" font-weight="700">12,0 kg</text>
  <text x="172" y="576" fill="#6b7a90" font-size="17">Volumetric weight</text>
  <text x="488" y="576" text-anchor="end" fill="#6b7a90" font-size="17">1,8 kg</text>
  <rect x="150" y="590" width="360" height="1.5" fill="#e3e8ef"/>
  <text x="172" y="606" fill="#0f3460" font-size="0"> </text>

  <!-- RIGHT card: big light parcel -->
  <text x="870" y="298" text-anchor="middle" fill="#0f3460" font-size="21" font-weight="700">Big &amp; light</text>
  <polygon points="870,314 962,360 870,406 778,360" fill="#fbe7e1"/>
  <polygon points="778,360 870,406 870,466 778,420" fill="#f4c7b8"/>
  <polygon points="962,360 870,406 870,466 962,420" fill="#eaa88f"/>
  <text x="870" y="492" text-anchor="middle" fill="#6b7a90" font-size="17">80 × 60 × 50 cm · 4,0 kg</text>
  <rect x="690" y="512" width="360" height="1.5" fill="#e3e8ef"/>
  <text x="712" y="546" fill="#6b7a90" font-size="17">Real weight</text>
  <text x="1028" y="546" text-anchor="end" fill="#6b7a90" font-size="17">4,0 kg</text>
  <text x="712" y="576" fill="#6b7a90" font-size="17">Volumetric weight</text>
  <text x="1028" y="576" text-anchor="end" fill="#e8431a" font-size="17" font-weight="700">48,0 kg</text>
  <rect x="690" y="590" width="360" height="1.5" fill="#e3e8ef"/>

  <!-- ── Effective weight banner ── -->
  <rect x="90" y="648" width="1020" height="88" rx="10" fill="#e8431a"/>
  <text x="130" y="684" fill="#ffffff" font-size="21" font-weight="700">Effective Weight = max( real weight , volumetric weight ) × qty</text>
  <text x="130" y="714" fill="#ffeee9" font-size="18">Available as a variable in every delivery price rule — the big light parcel is finally quoted at 48 kg, not 4 kg.</text>

  <!-- ── Feature strip ── -->
  <g fill="#ffffff" font-size="21">
    <circle cx="196" cy="794" r="12" fill="#e8431a"/>
    <text x="196" y="800" text-anchor="middle" font-size="15" font-weight="700">✓</text>
    <text x="218" y="801">Per-product divisor</text>

    <circle cx="530" cy="794" r="12" fill="#e8431a"/>
    <text x="530" y="800" text-anchor="middle" font-size="15" font-weight="700">✓</text>
    <text x="552" y="801">Works with any carrier</text>

    <circle cx="884" cy="794" r="12" fill="#e8431a"/>
    <text x="884" y="800" text-anchor="middle" font-size="15" font-weight="700">✓</text>
    <text x="906" y="801">Existing rules untouched</text>
  </g>

  <text x="600" y="858" text-anchor="middle" fill="#a0b4cc" font-size="19">Lógica Consultores 360 · www.logicaconsultores.com</text>
</svg>
